name: Build Fala+ APK

on:
  push:
    branches: [main, fix/android-audio-source-v1.8.2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct Android project
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t parts < <(find builddata -maxdepth 1 -type f -name 'project.b64.*' -print | sort -V)
          if (( ${#parts[@]} == 0 )); then
            echo "::error::No builddata/project.b64.* files were found"
            exit 1
          fi

          cat "${parts[@]}" | base64 --decode > fala-mais-android.zip
          unzip -tq fala-mais-android.zip
          mkdir android
          unzip -q fala-mais-android.zip -d android
          test -f android/settings.gradle
          test -f android/app/build.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore stable debug signing key
        id: debug-key-cache
        uses: actions/cache@v4
        with:
          path: .signing/debug.keystore
          key: fala-mais-debug-signing-v2

      - name: Prepare stable debug signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android" .signing
          if [[ ! -s .signing/debug.keystore ]]; then
            keytool -genkeypair -noprompt \
              -keystore .signing/debug.keystore \
              -storepass android \
              -alias falamaisdebug \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Fala Mais Debug, O=Fala Mais, C=BR"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check realtime backend
        working-directory: backend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm test

      - name: Check bundled configuration and secrets
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'https://fala-mais-api.onrender.com' android/app/src/main/assets/app.js
          grep -Fq 'create_response: true' backend/server.mjs
          grep -Fq 'android.permission.MODIFY_AUDIO_SETTINGS' android/app/src/main/AndroidManifest.xml
          grep -Fq 'acquireMicrophoneStream' android/app/src/main/assets/app.js
          grep -Fq 'releaseFalaMaisAudio' android/app/src/main/assets/app.js
          grep -Fq 'type: "session.update"' android/app/src/main/assets/app.js
          grep -Fq 'gpt-realtime-2.1' backend/server.mjs
          test -s android/app/src/main/assets/ai-avatar.webp
          if grep -RIE --exclude='*.jpg' --exclude='*.png' 'sk-(proj-)?[A-Za-z0-9_-]{20,}' android backend; then
            echo "::error::A value that looks like an OpenAI API key is present in the source"
            exit 1
          fi

      - name: Build APK
        working-directory: android
        run: |
          gradle assembleDebug --stacktrace \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/.signing/debug.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=falamaisdebug \
            -Pandroid.injected.signing.key.password=android

      - name: Persist stable debug signing key
        shell: bash
        run: |
          set -euo pipefail
          test -s .signing/debug.keystore || {
            echo "::error::The stable debug signing key is missing"
            exit 1
          }

      - name: Check APK is ready to test
        working-directory: android
        env:
          APK_PATH: app/build/outputs/apk/debug/app-debug.apk
        run: |
          set -euo pipefail

          test -s "$APK_PATH" || {
            echo "::error::APK is missing or empty: $APK_PATH"
            exit 1
          }

          unzip -tq "$APK_PATH" >/dev/null
          unzip -Z1 "$APK_PATH" > apk-entries.txt

          grep -Fqx 'AndroidManifest.xml' apk-entries.txt || {
            echo "::error::APK is missing AndroidManifest.xml"
            exit 1
          }
          grep -Fqx 'classes.dex' apk-entries.txt || {
            echo "::error::APK is missing classes.dex"
            exit 1
          }

          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk_root" || {
            echo "::error::Android SDK root is unavailable"
            exit 1
          }
          apksigner_path=$(find "$sdk_root/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)
          aapt_path=$(find "$sdk_root/build-tools" -type f -name aapt -print | sort -V | tail -n 1)
          test -x "$apksigner_path" || {
            echo "::error::apksigner was not found"
            exit 1
          }
          test -x "$aapt_path" || {
            echo "::error::aapt was not found"
            exit 1
          }
          "$apksigner_path" verify --verbose --print-certs "$APK_PATH"
          badging=$("$aapt_path" dump badging "$APK_PATH")
          [[ "$badging" == *"versionCode='12'"* ]] || {
            echo "::error::APK versionCode is not 12"
            exit 1
          }
          [[ "$badging" == *"versionName='1.9.0'"* ]] || {
            echo "::error::APK versionName is not 1.9.0"
            exit 1
          }
          unzip -p "$APK_PATH" assets/app.js | grep -Fq 'https://fala-mais-api.onrender.com'
          unzip -p "$APK_PATH" assets/app.js | grep -Fq 'type: "session.update"'
          unzip -Z1 "$APK_PATH" | grep -Fqx 'assets/ai-avatar.webp'

          size_bytes=$(stat -c '%s' "$APK_PATH")
          size_human=$(du -h "$APK_PATH" | cut -f1)
          sha256=$(sha256sum "$APK_PATH" | cut -d' ' -f1)

          {
            echo "## APK ready to test"
            echo
            echo "- File: $APK_PATH"
            echo "- Version: 1.9.0 (12)"
            echo "- Size: $size_human ($size_bytes bytes)"
            echo "- ZIP integrity: passed"
            echo "- Backend tests: passed"
            echo "- Embedded API key scan: passed"
            echo "- Debug signing key cache: enabled"
            echo "- APK signature verification: passed"
            echo "- Manifest version 1.9.0 (12): passed"
            echo "- Required APK entries: passed"
            echo "- SHA-256: $sha256"
            echo "- Open this workflow run to download the fala-mais-apk artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fala-mais-apk-v1.9.0
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
