name: Build Fala+ AI Hub APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-fala-ai-hub-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Restore known-good Android project
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/Valdiron/App-fala-mais/5f923a9fe32f1f6b603940e0d7c035e5a239f51e/mobiledata/project.b64.000" -o /tmp/project.b64
          base64 --decode /tmp/project.b64 > fala-mobile.zip
          unzip -tq fala-mobile.zip
          mkdir android
          unzip -q fala-mobile.zip -d android
          test -f android/settings.gradle
          test -f android/app/build.gradle
          test -f android/app/src/main/assets/index.html

      - name: Apply Android compatibility and version
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/res/drawable-nodpi
          base64 --decode mobiledata/app_icon.webp.b64 > android/app/src/main/res/drawable-nodpi/app_icon.webp
          cp android/app/src/main/res/drawable-nodpi/app_icon.webp android/app/src/main/assets/app_icon.webp

          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path('android/app/build.gradle')
          s = gradle.read_text()
          s = re.sub(r'minSdk\s+\d+', 'minSdk 21', s)
          s = re.sub(r'targetSdk\s+\d+', 'targetSdk 35', s)
          s = re.sub(r'versionCode\s+\d+', 'versionCode 8', s)
          s = re.sub(r"versionName\s+'[^']+'", "versionName '1.4.0'", s)
          gradle.write_text(s)

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          if 'android.hardware.microphone' not in s:
              s = s.replace('<application', '<uses-feature android:name="android.hardware.microphone" android:required="false" />\n    <application', 1)
          if 'android:hardwareAccelerated=' not in s:
              s = s.replace('<application', '<application\n        android:hardwareAccelerated="true"', 1)
          if 'android:icon=' not in s:
              s = s.replace('android:label="Fala+"', 'android:label="Fala+"\n        android:icon="@drawable/app_icon"\n        android:roundIcon="@drawable/app_icon"')
          manifest.write_text(s)

          java = Path('android/app/src/main/java/br/com/falamais/mobile/MainActivity.java')
          if java.exists():
              s = java.read_text()
              if 'import android.os.Build;' not in s:
                  s = s.replace('import android.os.Bundle;', 'import android.os.Bundle;\nimport android.os.Build;')
              s = s.replace(
                  'if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {',
                  'if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {'
              )
              java.write_text(s)
          PY

      - name: Apply full AI Hub interface
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/assets/index.html')
          s = p.read_text()

          s = s.replace('https://i.imgur.com/your-uploaded-icon.png', 'app_icon.webp')
          s = s.replace('https://i.imgur.com/your-avatar.png', 'app_icon.webp')

          css = r'''
          /* Fala+ AI Hub v1.4.0 */
          :root{--hub-bg:#05070b;--hub-card:#0c1119;--hub-card-2:#111826;--hub-line:rgba(255,255,255,.08);--hub-blue:#2f80ff;--hub-blue2:#0e5eea;--hub-text:#f7f9fc;--hub-muted:#7f8ba3}
          html,body{background:#05070b!important;color:var(--hub-text)!important}
          body{background:radial-gradient(circle at 50% -8%,rgba(48,94,190,.32),transparent 34%),#05070b!important;display:flex!important;align-items:stretch!important}
          .app-container{width:100%!important;max-width:430px!important;height:100vh!important;max-height:none!important;border-radius:0!important;border:none!important;background:linear-gradient(180deg,#06080d 0%,#05070b 100%)!important;box-shadow:none!important;padding-bottom:74px!important}
          .screen{background:#05070b!important}.screen.active{display:flex!important}
          header{padding:calc(14px + env(safe-area-inset-top)) 18px 12px!important;background:rgba(5,7,11,.94)!important;border-bottom:1px solid var(--hub-line)!important;backdrop-filter:blur(16px)}
          .back-btn{background:#101620!important;border:1px solid var(--hub-line)!important;color:#fff!important}

          .hub-home{padding:calc(14px + env(safe-area-inset-top)) 16px 18px;overflow-y:auto;flex:1}.hub-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.hub-brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:1.15rem}.hub-brand img{width:30px;height:30px;border-radius:10px}.hub-more{width:36px;height:36px;border-radius:12px;border:1px solid var(--hub-line);background:#0d121b;color:#fff;font-size:1.1rem}
          .hub-hero{position:relative;min-height:174px;border-radius:22px;padding:21px 19px;overflow:hidden;background:linear-gradient(135deg,#0b111a 0%,#0a1424 55%,#0d1c36 100%);border:1px solid rgba(78,134,255,.18);box-shadow:0 18px 40px rgba(0,0,0,.36);margin-bottom:14px}.hub-hero:after{content:"";position:absolute;width:180px;height:180px;right:-44px;top:16px;border-radius:50%;background:radial-gradient(circle,#3d82ff 0%,#1260e9 34%,rgba(18,96,233,.12) 70%,transparent 71%);filter:drop-shadow(0 0 25px rgba(47,128,255,.3))}.hub-robot{position:absolute;right:22px;top:37px;width:102px;height:102px;border-radius:50%;z-index:2;box-shadow:0 0 0 10px rgba(47,128,255,.08),0 0 38px rgba(47,128,255,.35);animation:hubFloat 3.2s ease-in-out infinite}.hub-hero h1{position:relative;z-index:3;font-size:1.55rem;max-width:210px;line-height:1.05;margin:0 0 7px}.hub-hero p{position:relative;z-index:3;color:#8d98ad;font-size:.78rem;max-width:210px;line-height:1.4}.hub-hero button{position:relative;z-index:3;margin-top:15px;border:1px solid rgba(255,255,255,.12);background:#0e131c;color:#fff;border-radius:999px;padding:9px 16px;font-weight:700}
          @keyframes hubFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}

          .hub-section{margin-top:18px}.hub-section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.hub-section-head h2{font-size:1rem;margin:0}.hub-section-head span{font-size:.72rem;color:#7d89a0}
          .hub-feature-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:10px}.hub-feature{border-radius:18px;padding:14px;background:linear-gradient(145deg,#0e1726,#0b111a);border:1px solid rgba(70,124,255,.18);min-height:112px;position:relative;overflow:hidden}.hub-feature.secondary{background:linear-gradient(145deg,#111728,#0b111a)}.hub-feature .ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:1.35rem;background:linear-gradient(145deg,#1570ff,#154cb5);box-shadow:0 10px 24px rgba(34,100,230,.28);margin-bottom:12px}.hub-feature h3{font-size:.91rem;margin:0 0 3px}.hub-feature p{font-size:.68rem;color:#79859b;line-height:1.25}
          .hub-shortcuts{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:12px}.hub-shortcut{text-align:center;color:#aab4c7;font-size:.65rem}.hub-shortcut button{width:48px;height:48px;border-radius:15px;border:1px solid var(--hub-line);background:#0d121a;color:#fff;font-size:1.15rem;display:grid;place-items:center;margin:0 auto 6px;box-shadow:0 8px 18px rgba(0,0,0,.25)}
          .hub-tool-list{display:grid;grid-template-columns:1fr 1fr;gap:9px}.hub-tool{display:flex;align-items:center;gap:9px;border:1px solid var(--hub-line);background:#0b0f16;border-radius:15px;padding:11px}.hub-tool .tool-ico{width:35px;height:35px;border-radius:11px;display:grid;place-items:center;background:#111a28;color:#67a4ff}.hub-tool b{font-size:.78rem;display:block}.hub-tool span{font-size:.62rem;color:#6f7c92}

          .language-selector-bar{margin:0!important;padding:9px 11px!important;border-radius:14px!important;background:#0b1017!important;border:1px solid var(--hub-line)!important}.language-selector-bar select{color:#66a4ff!important;background:#0b1017!important}
          .modules-list{padding:12px 16px 92px!important;gap:10px!important}.module-card{border-radius:18px!important;background:#0b1017!important;border:1px solid var(--hub-line)!important;box-shadow:none!important}.module-card.ai-mode,.module-card.game-mode{background:linear-gradient(145deg,#0d1726,#0b1017)!important;border-color:rgba(47,128,255,.22)!important}.module-icon{background:#111a28!important;border-color:var(--hub-line)!important;border-radius:13px!important}.module-info span{color:#748197!important}

          .lesson-content,.game-content{padding:22px 18px 96px!important;background:radial-gradient(circle at 50% 18%,rgba(47,128,255,.1),transparent 32%),#05070b!important}.scenario-tag{background:#0d1726!important;color:#67a4ff!important;border-color:rgba(47,128,255,.22)!important}.phrase-card{font-size:1.65rem!important}.translation{color:#8a96aa!important}.audio-btn{background:#0e1623!important;border-color:rgba(47,128,255,.2)!important;color:#67a4ff!important}.mic-btn{background:linear-gradient(135deg,#2f80ff,#0e5eea)!important;box-shadow:0 12px 30px rgba(30,102,235,.28)!important}.action-btn{background:linear-gradient(135deg,#2f80ff,#0e5eea)!important;border-radius:16px!important}.game-option-btn{background:#0c1119!important;border:1px solid var(--hub-line)!important;border-radius:15px!important}.game-option-btn:hover{border-color:#2f80ff!important;background:#0e1726!important}

          .ai-motion-stage,.ai-stage{background:linear-gradient(180deg,#0a1423,#05070b)!important;border-bottom:1px solid var(--hub-line)!important;padding-top:22px!important}.ai-motion-avatar,.ai-robot-avatar{width:106px!important;height:106px!important;border:4px solid #2f80ff!important;box-shadow:0 0 0 10px rgba(47,128,255,.06),0 0 35px rgba(47,128,255,.3)!important}.ai-motion-status,.ai-speech-bubble{background:#0b1119!important;border:1px solid var(--hub-line)!important;color:#dce6f7!important;border-radius:16px!important}.chat-box{background:#05070b!important;padding-bottom:90px!important}.chat-bubble.ai{background:#0c1119!important;border-color:var(--hub-line)!important}.chat-bubble.user{background:linear-gradient(135deg,#2f80ff,#155ac7)!important}.mic-btn.ai-mic{background:linear-gradient(135deg,#2f80ff,#0e5eea)!important}

          .hub-bottom-nav{position:absolute;left:0;right:0;bottom:0;height:72px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);background:rgba(6,8,12,.97);border-top:1px solid var(--hub-line);backdrop-filter:blur(18px);z-index:50}.hub-nav-btn{border:0;background:transparent;color:#67748a;font-size:.62rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.hub-nav-btn span:first-child{font-size:1.15rem}.hub-nav-btn.active{color:#67a4ff}
          footer{padding-bottom:calc(84px + env(safe-area-inset-bottom))!important;background:#05070b!important;border-color:var(--hub-line)!important}
          '''
          s = s.replace('</style>', css + '\n</style>', 1)

          script = r'''
          <script>
          (function(){
            function call(name,args){ try{ if(typeof window[name]==='function') return window[name].apply(window,args||[]); }catch(e){} }
            function activateNav(key){ document.querySelectorAll('.hub-nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.key===key)); }
            function renderHub(){
              const home=document.getElementById('homeScreen'); if(!home) return;
              home.innerHTML=`<div class="hub-home">
                <div class="hub-top"><div class="hub-brand"><img src="app_icon.webp">Fala+</div><button class="hub-more">•••</button></div>
                <div class="hub-hero"><img src="app_icon.webp" class="hub-robot"><h1>Explore o poder da IA</h1><p>Pratique idiomas com voz, jogos e um assistente inteligente em tempo real.</p><button onclick="startAIChat()">Experimentar agora</button></div>
                <div class="language-selector-bar"><span style="font-size:.76rem;color:#7f8ba3">🌍 Idioma</span><select id="globalLang" onchange="changeLanguage()"><option value="en-US">English</option><option value="es-ES">Español</option><option value="fr-FR">Français</option><option value="de-DE">Deutsch</option><option value="it-IT">Italiano</option><option value="ja-JP">日本語</option></select></div>
                <div class="hub-section"><div class="hub-section-head"><h2>Ferramentas principais</h2><span>Fala+ AI</span></div><div class="hub-feature-grid">
                  <div class="hub-feature" onclick="startAIChat()"><div class="ico">🤖</div><h3>Assistente IA</h3><p>Converse por voz e receba respostas instantâneas.</p></div>
                  <div class="hub-feature secondary" onclick="startAIGame()"><div class="ico">🎮</div><h3>Jogos IA</h3><p>Quiz e desafios rápidos.</p></div>
                </div></div>
                <div class="hub-shortcuts"><div class="hub-shortcut"><button onclick="startModule(0)">👋</button>Frases</div><div class="hub-shortcut"><button onclick="startAIGame()">🎯</button>Quiz</div><div class="hub-shortcut"><button onclick="startAIChat()">🎤</button>Voz</div><div class="hub-shortcut"><button onclick="startModule(1)">🍔</button>Prática</div><div class="hub-shortcut"><button onclick="startAIChat()">💬</button>Chat</div></div>
                <div class="hub-section"><div class="hub-section-head"><h2>Aprender agora</h2><span>Ver tudo</span></div><div class="hub-tool-list">
                  <div class="hub-tool" onclick="startModule(0)"><div class="tool-ico">👋</div><div><b>Apresentações</b><span>Frases essenciais</span></div></div>
                  <div class="hub-tool" onclick="startModule(1)"><div class="tool-ico">🍔</div><div><b>Restaurante</b><span>Vocabulário útil</span></div></div>
                  <div class="hub-tool" onclick="startAIGame()"><div class="tool-ico">⚡</div><div><b>Desafio rápido</b><span>Ganhe XP</span></div></div>
                  <div class="hub-tool" onclick="startAIChat()"><div class="tool-ico">🧠</div><div><b>IA ao vivo</b><span>Treino inteligente</span></div></div>
                </div></div>
              </div>`;
            }
            function addNav(){
              const app=document.querySelector('.app-container'); if(!app||document.querySelector('.hub-bottom-nav')) return;
              const nav=document.createElement('div'); nav.className='hub-bottom-nav'; nav.innerHTML=`<button class="hub-nav-btn active" data-key="home"><span>⌂</span><span>Início</span></button><button class="hub-nav-btn" data-key="learn"><span>▥</span><span>Aprender</span></button><button class="hub-nav-btn" data-key="game"><span>🎮</span><span>Jogos</span></button><button class="hub-nav-btn" data-key="ai"><span>🤖</span><span>IA</span></button>`;
              nav.children[0].onclick=()=>{call('goToHome');activateNav('home')};
              nav.children[1].onclick=()=>{call('startModule',[0]);activateNav('learn')};
              nav.children[2].onclick=()=>{call('startAIGame');activateNav('game')};
              nav.children[3].onclick=()=>{call('startAIChat');activateNav('ai')};
              app.appendChild(nav);
            }
            const oldStartAI=window.startAIChat, oldStartGame=window.startAIGame, oldStartModule=window.startModule, oldHome=window.goToHome;
            if(oldStartAI) window.startAIChat=function(){const r=oldStartAI.apply(this,arguments);activateNav('ai');return r};
            if(oldStartGame) window.startAIGame=function(){const r=oldStartGame.apply(this,arguments);activateNav('game');return r};
            if(oldStartModule) window.startModule=function(){const r=oldStartModule.apply(this,arguments);activateNav('learn');return r};
            if(oldHome) window.goToHome=function(){const r=oldHome.apply(this,arguments);activateNav('home');return r};
            renderHub(); addNav();
          })();
          </script>
          '''
          s = s.replace('</body>', script + '\n</body>', 1)
          p.write_text(s)
          PY
          grep -Fq 'Fala+ AI Hub v1.4.0' android/app/src/main/assets/index.html
          grep -Fq 'hub-bottom-nav' android/app/src/main/assets/index.html
          grep -Fq 'Explore o poder da IA' android/app/src/main/assets/index.html

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore stable signing key
        uses: actions/cache@v4
        with:
          path: .signing/falamais.keystore
          key: fala-mais-compatible-signing-v1

      - name: Prepare stable signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .signing
          if [[ ! -s .signing/falamais.keystore ]]; then
            keytool -genkeypair -noprompt -keystore .signing/falamais.keystore -storepass android -alias falamais -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Fala Mais, O=Fala Mais, C=BR"
          fi

      - name: Build AI Hub APK
        working-directory: android
        run: |
          gradle assembleDebug --stacktrace \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/.signing/falamais.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=falamais \
            -Pandroid.injected.signing.key.password=android

      - name: Verify APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -tq "$APK" >/dev/null
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          aapt=$(find "$sdk_root/build-tools" -type f -name aapt -print | sort -V | tail -n 1)
          apksigner=$(find "$sdk_root/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)
          "$apksigner" verify --verbose --print-certs "$APK"
          badging=$("$aapt" dump badging "$APK")
          echo "$badging" | grep -F "sdkVersion:'21'"
          echo "$badging" | grep -F "targetSdkVersion:'35'"
          echo "$badging" | grep -F "versionCode='8'"
          echo "$badging" | grep -F "versionName='1.4.0'"
          unzip -p "$APK" assets/index.html | grep -Fq 'Fala+ AI Hub v1.4.0'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fala-mais-ai-hub-v1.4.0
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
