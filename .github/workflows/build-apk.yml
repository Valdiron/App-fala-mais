name: Build Fala+ Motion AI APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-fala-motion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Restore stable Android source
        shell: bash
        run: |
          set -euo pipefail
          git show d22f0b7e1e734110e948ed0f335528234109f8d0:mobiledata/project.b64.000 > /tmp/project.b64
          base64 --decode /tmp/project.b64 > fala-mobile.zip
          unzip -tq fala-mobile.zip
          mkdir android
          unzip -q fala-mobile.zip -d android
          test -f android/app/src/main/assets/index.html

      - name: Apply Motion AI interface
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/motion.b64 <<'B64'

B64
          base64 --decode /tmp/motion.b64 | gzip -d > android/app/src/main/assets/index.html
          grep -Fq 'Fala+ App - Motion AI Edition' android/app/src/main/assets/index.html
          grep -Fq 'id="robotAvatar"' android/app/src/main/assets/index.html
          grep -Fq 'setAISpeaking' android/app/src/main/assets/index.html

      - name: Apply Android compatibility and version
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/res/drawable-nodpi
          git show d22f0b7e1e734110e948ed0f335528234109f8d0:mobiledata/app_icon.webp.b64 | base64 --decode > android/app/src/main/res/drawable-nodpi/app_icon.webp
          python3 - <<'PY'
          from pathlib import Path
          import re
          gradle=Path('android/app/build.gradle')
          text=gradle.read_text()
          text=re.sub(r'minSdk\s+\d+','minSdk 21',text)
          text=re.sub(r'targetSdk\s+\d+','targetSdk 35',text)
          text=re.sub(r'versionCode\s+\d+','versionCode 7',text)
          text=re.sub(r"versionName\s+'[^']+'","versionName '1.3.0'",text)
          gradle.write_text(text)
          manifest=Path('android/app/src/main/AndroidManifest.xml')
          text=manifest.read_text()
          if 'android.hardware.microphone' not in text:
              text=text.replace('<application','<uses-feature android:name="android.hardware.microphone" android:required="false" />\n    <application',1)
          if 'android:hardwareAccelerated=' not in text:
              text=text.replace('<application','<application\n        android:hardwareAccelerated="true"',1)
          if 'android:supportsRtl=' not in text:
              text=text.replace('android:allowBackup="true"','android:allowBackup="true"\n        android:supportsRtl="true"')
          if 'android:icon=' not in text:
              text=text.replace('android:label="Fala+"','android:label="Fala+"\n        android:icon="@drawable/app_icon"\n        android:roundIcon="@drawable/app_icon"')
          manifest.write_text(text)
          java=Path('android/app/src/main/java/br/com/falamais/mobile/MainActivity.java')
          if java.exists():
              text=java.read_text()
              if 'import android.os.Build;' not in text:
                  text=text.replace('import android.os.Bundle;','import android.os.Bundle;\nimport android.os.Build;')
              text=text.replace('if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {','if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {')
              java.write_text(text)
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore stable signing key
        uses: actions/cache@v4
        with:
          path: .signing/falamais.keystore
          key: fala-mais-compatible-signing-v1

      - name: Prepare stable signing key
        shell: bash
        run: |
          mkdir -p .signing
          if [[ ! -s .signing/falamais.keystore ]]; then
            keytool -genkeypair -noprompt -keystore .signing/falamais.keystore -storepass android -alias falamais -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Fala Mais, O=Fala Mais, C=BR"
          fi

      - name: Build Motion AI APK
        working-directory: android
        run: |
          gradle assembleDebug --stacktrace \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/.signing/falamais.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=falamais \
            -Pandroid.injected.signing.key.password=android

      - name: Verify Motion AI APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -tq "$APK" >/dev/null
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          aapt=$(find "$sdk_root/build-tools" -type f -name aapt -print | sort -V | tail -n 1)
          apksigner=$(find "$sdk_root/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)
          "$apksigner" verify --verbose --print-certs "$APK"
          badging=$("$aapt" dump badging "$APK")
          echo "$badging" | grep -F "sdkVersion:'21'"
          echo "$badging" | grep -F "targetSdkVersion:'35'"
          echo "$badging" | grep -F "versionCode='7'"
          echo "$badging" | grep -F "versionName='1.3.0'"
          unzip -p "$APK" assets/index.html | grep -Fq 'Fala+ App - Motion AI Edition'

      - name: Upload Motion AI APK
        uses: actions/upload-artifact@v4
        with:
          name: fala-mais-motion-ai-v1.3.0
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
