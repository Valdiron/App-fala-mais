name: Build Fala+ Motion AI APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-fala-motion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Restore known-good Android project
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/Valdiron/App-fala-mais/5f923a9fe32f1f6b603940e0d7c035e5a239f51e/mobiledata/project.b64.000" -o /tmp/project.b64
          base64 --decode /tmp/project.b64 > fala-mobile.zip
          unzip -tq fala-mobile.zip
          mkdir android
          unzip -q fala-mobile.zip -d android
          test -f android/settings.gradle
          test -f android/app/build.gradle
          test -f android/app/src/main/assets/index.html

      - name: Apply Android compatibility and version
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/res/drawable-nodpi
          base64 --decode mobiledata/app_icon.webp.b64 > android/app/src/main/res/drawable-nodpi/app_icon.webp
          cp android/app/src/main/res/drawable-nodpi/app_icon.webp android/app/src/main/assets/app_icon.webp

          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path('android/app/build.gradle')
          s = gradle.read_text()
          s = re.sub(r'minSdk\s+\d+', 'minSdk 21', s)
          s = re.sub(r'targetSdk\s+\d+', 'targetSdk 35', s)
          s = re.sub(r'versionCode\s+\d+', 'versionCode 7', s)
          s = re.sub(r"versionName\s+'[^']+'", "versionName '1.3.1'", s)
          gradle.write_text(s)

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          if 'android.hardware.microphone' not in s:
              s = s.replace('<application', '<uses-feature android:name="android.hardware.microphone" android:required="false" />\n    <application', 1)
          if 'android:hardwareAccelerated=' not in s:
              s = s.replace('<application', '<application\n        android:hardwareAccelerated="true"', 1)
          if 'android:icon=' not in s:
              s = s.replace('android:label="Fala+"', 'android:label="Fala+"\n        android:icon="@drawable/app_icon"\n        android:roundIcon="@drawable/app_icon"')
          manifest.write_text(s)

          java = Path('android/app/src/main/java/br/com/falamais/mobile/MainActivity.java')
          if java.exists():
              s = java.read_text()
              if 'import android.os.Build;' not in s:
                  s = s.replace('import android.os.Bundle;', 'import android.os.Bundle;\nimport android.os.Build;')
              s = s.replace(
                  'if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {',
                  'if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {'
              )
              java.write_text(s)
          PY

      - name: Apply Motion AI interface
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/assets/index.html')
          s = p.read_text()

          css = r'''
          /* Fala+ Motion AI v1.3.1 */
          body{background:radial-gradient(circle at 18% 8%,rgba(59,130,246,.28),transparent 30%),radial-gradient(circle at 82% 18%,rgba(139,92,246,.30),transparent 34%),linear-gradient(155deg,#07111f,#0a1230 45%,#090d16)!important}
          .app-container{background:linear-gradient(160deg,rgba(17,30,61,.95),rgba(8,13,28,.96))!important;border-color:rgba(145,192,255,.22)!important;box-shadow:0 28px 80px rgba(0,0,0,.48),0 0 90px rgba(74,123,255,.18)!important}
          .module-card{border-radius:22px!important;background:linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.045))!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 12px 26px rgba(0,0,0,.18)!important}
          .module-card.ai-mode{background:linear-gradient(135deg,rgba(112,92,255,.26),rgba(83,139,255,.12))!important;border-color:rgba(167,139,250,.45)!important}
          .module-card.game-mode{background:linear-gradient(135deg,rgba(255,149,77,.23),rgba(255,76,155,.11))!important;border-color:rgba(251,191,36,.42)!important}
          .ai-motion-stage{padding:18px 15px 12px;text-align:center;background:linear-gradient(180deg,rgba(139,92,246,.17),rgba(13,17,23,0));border-bottom:1px solid rgba(139,92,246,.22);position:relative}
          .ai-motion-avatar{width:92px;height:92px;border-radius:50%;border:3px solid #8b5cf6;object-fit:cover;box-shadow:0 0 25px rgba(139,92,246,.58);animation:floatRobot 3s ease-in-out infinite}
          .ai-motion-avatar.speaking{border-color:#22c55e;animation:floatRobot 3s ease-in-out infinite,glowRobot .5s alternate infinite}
          @keyframes floatRobot{0%{transform:translateY(0) rotate(0)}50%{transform:translateY(-7px) rotate(1deg)}100%{transform:translateY(0) rotate(0)}}
          @keyframes glowRobot{from{box-shadow:0 0 14px rgba(34,197,94,.45)}to{box-shadow:0 0 34px rgba(34,197,94,.92)}}
          .ai-motion-status{margin:9px auto 0;max-width:310px;min-height:40px;display:flex;align-items:center;justify-content:center;padding:10px 14px;border-radius:16px;background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.12);font-size:.84rem}
          .chat-bubble.ai{background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.05))!important}.chat-bubble.user{background:linear-gradient(135deg,#5865ff,#9a5bff)!important}
          .mic-btn.ai-mic{background:linear-gradient(135deg,#8b5cf6,#6d28d9)!important;box-shadow:0 8px 25px rgba(139,92,246,.42)!important}
          '''
          s = s.replace('</style>', css + '\n</style>', 1)

          # Make local icon work offline.
          s = s.replace('https://i.imgur.com/your-uploaded-icon.png', 'app_icon.webp')
          s = s.replace('https://i.imgur.com/your-avatar.png', 'app_icon.webp')

          # Upgrade the AI chat screen with animated avatar if the standard screen exists.
          marker = '<div id="aiChatScreen" class="screen">'
          if marker in s and 'ai-motion-stage' not in s:
              s = s.replace(marker, marker + '''\n<div class="ai-motion-stage"><img src="app_icon.webp" id="robotAvatar" class="ai-motion-avatar" alt="Assistente Fala+"><div class="ai-motion-status" id="aiSpeechBubble">Olá! Estou pronto para conversar com você.</div></div>''', 1)

          # Add robust animation hooks without breaking existing speech functions.
          hook = r'''
          <script>
          (function(){
            function avatar(){return document.getElementById('robotAvatar')}
            function bubble(){return document.getElementById('aiSpeechBubble')}
            window.setRobotSpeaking=function(on,text){
              const a=avatar(), b=bubble();
              if(a) a.classList.toggle('speaking',!!on);
              if(b && text) b.textContent=text;
            };
            if('speechSynthesis' in window){
              window.speechSynthesis.addEventListener && window.speechSynthesis.addEventListener('voiceschanged',function(){});
            }
            const OriginalUtterance=window.SpeechSynthesisUtterance;
            if(OriginalUtterance){
              window.SpeechSynthesisUtterance=function(text){
                const u=new OriginalUtterance(text);
                u.addEventListener('start',()=>window.setRobotSpeaking(true,text||'Falando...'));
                u.addEventListener('end',()=>window.setRobotSpeaking(false,'Pronto para ouvir você.'));
                u.addEventListener('error',()=>window.setRobotSpeaking(false,'Não consegui reproduzir a voz.'));
                return u;
              };
              window.SpeechSynthesisUtterance.prototype=OriginalUtterance.prototype;
            }
          })();
          </script>
          '''
          s = s.replace('</body>', hook + '\n</body>', 1)
          p.write_text(s)
          PY
          grep -Fq 'Fala+ Motion AI v1.3.1' android/app/src/main/assets/index.html
          grep -Fq 'ai-motion-avatar' android/app/src/main/assets/index.html

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore stable signing key
        uses: actions/cache@v4
        with:
          path: .signing/falamais.keystore
          key: fala-mais-compatible-signing-v1

      - name: Prepare stable signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .signing
          if [[ ! -s .signing/falamais.keystore ]]; then
            keytool -genkeypair -noprompt -keystore .signing/falamais.keystore -storepass android -alias falamais -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Fala Mais, O=Fala Mais, C=BR"
          fi

      - name: Build Motion AI APK
        working-directory: android
        run: |
          gradle assembleDebug --stacktrace \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/.signing/falamais.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=falamais \
            -Pandroid.injected.signing.key.password=android

      - name: Verify APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -tq "$APK" >/dev/null
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          aapt=$(find "$sdk_root/build-tools" -type f -name aapt -print | sort -V | tail -n 1)
          apksigner=$(find "$sdk_root/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)
          "$apksigner" verify --verbose --print-certs "$APK"
          badging=$("$aapt" dump badging "$APK")
          echo "$badging" | grep -F "sdkVersion:'21'"
          echo "$badging" | grep -F "targetSdkVersion:'35'"
          echo "$badging" | grep -F "versionCode='7'"
          echo "$badging" | grep -F "versionName='1.3.1'"
          unzip -p "$APK" assets/index.html | grep -Fq 'Fala+ Motion AI v1.3.1'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fala-mais-motion-ai-v1.3.1
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
