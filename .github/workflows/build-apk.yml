name: Build Fala+ APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct Android project
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t parts < <(find builddata -maxdepth 1 -type f -name 'project.b64.*' -print | sort -V)
          if (( ${#parts[@]} == 0 )); then
            echo "::error::No builddata/project.b64.* files were found"
            exit 1
          fi

          cat "${parts[@]}" | base64 --decode > fala-mais-android.zip
          unzip -tq fala-mais-android.zip
          mkdir android
          unzip -q fala-mais-android.zip -d android
          test -f android/settings.gradle
          test -f android/app/build.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check realtime backend
        working-directory: backend
        run: npm run check

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: Check APK is ready to test
        working-directory: android
        env:
          APK_PATH: app/build/outputs/apk/debug/app-debug.apk
        run: |
          set -euo pipefail

          test -s "$APK_PATH" || {
            echo "::error::APK is missing or empty: $APK_PATH"
            exit 1
          }

          unzip -tq "$APK_PATH" >/dev/null
          unzip -Z1 "$APK_PATH" > apk-entries.txt

          grep -Fqx 'AndroidManifest.xml' apk-entries.txt || {
            echo "::error::APK is missing AndroidManifest.xml"
            exit 1
          }
          grep -Fqx 'classes.dex' apk-entries.txt || {
            echo "::error::APK is missing classes.dex"
            exit 1
          }

          size_bytes=$(stat -c '%s' "$APK_PATH")
          size_human=$(du -h "$APK_PATH" | cut -f1)
          sha256=$(sha256sum "$APK_PATH" | cut -d' ' -f1)

          {
            echo "## APK ready to test"
            echo
            echo "- File: $APK_PATH"
            echo "- Size: $size_human ($size_bytes bytes)"
            echo "- ZIP integrity: passed"
            echo "- Required APK entries: passed"
            echo "- SHA-256: $sha256"
            echo "- Open this workflow run to download the fala-mais-apk artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fala-mais-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
