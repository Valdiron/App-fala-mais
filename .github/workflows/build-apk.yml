name: Build Fala+ Compatible APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-fala-compatible-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct Android project
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t parts < <(find mobiledata -maxdepth 1 -type f -name 'project.b64.*' -print | sort -V)
          test ${#parts[@]} -gt 0
          cat "${parts[@]}" | base64 --decode > fala-mobile.zip
          unzip -tq fala-mobile.zip
          mkdir android
          unzip -q fala-mobile.zip -d android
          test -f android/settings.gradle
          test -f android/app/build.gradle
          test -f android/app/src/main/assets/index.html

      - name: Apply Android compatibility fixes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/res/drawable-nodpi
          base64 --decode mobiledata/app_icon.webp.b64 > android/app/src/main/res/drawable-nodpi/app_icon.webp

          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path('android/app/build.gradle')
          text = gradle.read_text()
          text = re.sub(r'minSdk\s+\d+', 'minSdk 21', text)
          text = re.sub(r'targetSdk\s+\d+', 'targetSdk 35', text)
          text = re.sub(r'versionCode\s+\d+', 'versionCode 5', text)
          text = re.sub(r"versionName\s+'[^']+'", "versionName '1.1.2'", text)
          gradle.write_text(text)

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          if 'android.hardware.microphone' not in text:
              text = text.replace('<application', '<uses-feature android:name="android.hardware.microphone" android:required="false" />\n    <application', 1)
          if 'android:hardwareAccelerated=' not in text:
              text = text.replace('<application', '<application\n        android:hardwareAccelerated="true"', 1)
          if 'android:supportsRtl=' not in text:
              text = text.replace('android:allowBackup="true"', 'android:allowBackup="true"\n        android:supportsRtl="true"')
          if 'android:icon=' not in text:
              text = text.replace('android:label="Fala+"', 'android:label="Fala+"\n        android:icon="@drawable/app_icon"\n        android:roundIcon="@drawable/app_icon"')
          manifest.write_text(text)

          java = Path('android/app/src/main/java/br/com/falamais/mobile/MainActivity.java')
          if java.exists():
              text = java.read_text()
              if 'import android.os.Build;' not in text:
                  text = text.replace('import android.os.Bundle;', 'import android.os.Bundle;\nimport android.os.Build;')
              text = text.replace(
                  'if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {',
                  'if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {'
              )
              java.write_text(text)
          PY

          grep -Eq 'minSdk[[:space:]]+21' android/app/build.gradle
          grep -Eq 'targetSdk[[:space:]]+35' android/app/build.gradle
          grep -Eq 'versionCode[[:space:]]+5' android/app/build.gradle
          grep -Fq "versionName '1.1.2'" android/app/build.gradle
          grep -Fq 'android.hardware.microphone' android/app/src/main/AndroidManifest.xml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore stable signing key
        uses: actions/cache@v4
        with:
          path: .signing/falamais.keystore
          key: fala-mais-compatible-signing-v1

      - name: Prepare stable signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .signing
          if [[ ! -s .signing/falamais.keystore ]]; then
            keytool -genkeypair -noprompt \
              -keystore .signing/falamais.keystore \
              -storepass android \
              -alias falamais \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Fala Mais, O=Fala Mais, C=BR"
          fi

      - name: Build universal compatible APK
        working-directory: android
        run: |
          gradle assembleDebug --stacktrace \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/.signing/falamais.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=falamais \
            -Pandroid.injected.signing.key.password=android

      - name: Verify compatibility and signature
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -tq "$APK" >/dev/null
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          aapt=$(find "$sdk_root/build-tools" -type f -name aapt -print | sort -V | tail -n 1)
          apksigner=$(find "$sdk_root/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)
          "$apksigner" verify --verbose --print-certs "$APK"
          badging=$("$aapt" dump badging "$APK")
          echo "$badging" | grep -F "sdkVersion:'21'"
          echo "$badging" | grep -F "targetSdkVersion:'35'"
          echo "$badging" | grep -F "versionCode='5'"
          echo "$badging" | grep -F "versionName='1.1.2'"
          if unzip -Z1 "$APK" | grep -q '^lib/'; then
            echo 'Native libraries detected:'
            unzip -Z1 "$APK" | grep '^lib/'
          else
            echo 'Universal APK: no ABI-specific native libraries.'
          fi

      - name: Upload compatible APK
        uses: actions/upload-artifact@v4
        with:
          name: fala-mais-compatible-v1.1.2
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
