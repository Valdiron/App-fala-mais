name: Build Fala+ Mobile APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-fala-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct Android mobile project
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t parts < <(find mobiledata -maxdepth 1 -type f -name 'project.b64.*' -print | sort -V)
          test ${#parts[@]} -gt 0
          cat "${parts[@]}" | base64 --decode > fala-mobile.zip
          unzip -tq fala-mobile.zip
          mkdir android
          unzip -q fala-mobile.zip -d android
          test -f android/settings.gradle
          test -f android/app/build.gradle
          test -f android/app/src/main/assets/index.html

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Android APK
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: Verify APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -tq "$APK" >/dev/null
          unzip -Z1 "$APK" | grep -Fqx 'AndroidManifest.xml'
          unzip -Z1 "$APK" | grep -Fqx 'classes.dex'
          unzip -Z1 "$APK" | grep -Fqx 'assets/index.html'
          echo "Fala+ APK ready: $(du -h "$APK" | cut -f1)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fala-mais-mobile-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
