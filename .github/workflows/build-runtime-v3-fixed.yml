name: Build Fala+ Runtime V3 Fixed APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-runtime-v3-fixed.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: build-fala-runtime-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Restore latest validated global fixed APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/base
          RUN_ID=$(gh run list -R Valdiron/App-fala-mais --workflow build-new-home-global.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "$RUN_ID"
          gh run download "$RUN_ID" -R Valdiron/App-fala-mais -n fala-mais-new-home-global-fixed -D /tmp/base
          APK=$(find /tmp/base -type f -name '*.apk' -print -quit)
          test -s "$APK"
          cp "$APK" /tmp/fala-base.apk
          unzip -p "$APK" assets/index.html > /tmp/index.html
          unzip -p "$APK" assets/app_icon.webp > /tmp/app_icon.webp
          unzip -p "$APK" assets/assistant_robot_transparent.webp > /tmp/assistant_robot_transparent.webp
          test -s /tmp/index.html

      - name: Fix shared state locale races and background callbacks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('/tmp/index.html')
          s=p.read_text(encoding='utf-8')

          # The original app used lexical `let` globals, while the runtime hotfixes
          # intentionally address them through window.*. Convert the single shared
          # state declaration to var so score/lives/language/module state stay synced.
          s,n=re.subn(r'\blet currentLang=', 'var currentLang=', s, count=1)
          if n!=1:
              raise SystemExit('Shared state declaration not found')

          css='''\n<style id="runtimeV3Css">\nbutton:disabled{opacity:.55;pointer-events:none}.mic-btn[aria-pressed="true"]{outline:2px solid rgba(255,255,255,.55);outline-offset:3px}.app-container{isolation:isolate}.chat-box{scroll-behavior:smooth}.ai-speech-bubble{overflow-wrap:anywhere}.game-option{min-height:46px}\n</style>\n'''
          s=s.replace('</head>',css+'</head>',1)

          v3=r'''
          <script id="falaRuntimeV3">
          (function(){
            'use strict';
            const $=id=>document.getElementById(id);
            let chatRec=null, lessonRec=null, chatBusy=false, lessonBusy=false, session=0;
            const stop=r=>{try{r&&r.abort()}catch(e){}};
            const robotState=state=>{const r=$('robotAvatar');if(!r)return;r.classList.remove('listening','thinking','speaking');if(state)r.classList.add(state)};
            const active=id=>$(id)?.classList.contains('active');
            const SR=()=>window.SpeechRecognition||window.webkitSpeechRecognition;
            const statusError=e=>e==='not-allowed'||e==='service-not-allowed'?'Permita o microfone nas configurações do Android.':e==='no-speech'?'Não ouvi sua voz. Tente novamente.':e==='audio-capture'?'Microfone indisponível ou ocupado.':'Falha no reconhecimento. Tente novamente.';

            // Keep restored locale synchronized with the app's own shared state.
            document.addEventListener('DOMContentLoaded',()=>{
              const sel=$('globalLang');
              if(sel){
                try{const saved=localStorage.getItem('falaLang');if(saved&&[...sel.options].some(o=>o.value===saved))sel.value=saved}catch(e){}
                try{window.changeLanguage?.()}catch(e){window.currentLang=sel.value}
              }
              const scoreEl=$('scoreCount'); if(scoreEl)scoreEl.textContent=String(Number(window.score)||0);
              const livesEl=$('livesCount'); if(livesEl)livesEl.textContent=String(Number(window.lives)||3);
            });

            const prevHome=window.goToHome;
            window.goToHome=function(){
              session++; stop(chatRec); stop(lessonRec); chatBusy=false; lessonBusy=false; robotState('');
              $('aiMicBtn')?.classList.remove('listening'); $('micBtn')?.classList.remove('listening');
              $('aiMicBtn')?.setAttribute('aria-pressed','false'); $('micBtn')?.setAttribute('aria-pressed','false');
              try{speechSynthesis?.cancel()}catch(e){}
              try{return prevHome?.()}catch(e){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id==='homeScreen'))}
            };

            const prevStartAI=window.startAIChat;
            window.startAIChat=function(){
              session++; stop(chatRec); chatBusy=false; robotState('');
              try{speechSynthesis?.cancel()}catch(e){}
              try{return prevStartAI?.()}catch(e){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id==='aiChatScreen'))}
            };

            window.toggleAIChatSpeech=function(){
              if(chatBusy){stop(chatRec);return}
              const C=SR(),btn=$('aiMicBtn'),status=$('aiMicStatus'),chat=$('chatBox');
              if(!C){if(status)status.textContent='Reconhecimento de voz não disponível neste aparelho.';return}
              const mySession=session;
              chatRec=new C(); chatRec.lang=window.currentLang||$('globalLang')?.value||'en-US'; chatRec.interimResults=false; chatRec.maxAlternatives=1;
              chatBusy=true; btn?.classList.add('listening'); btn?.setAttribute('aria-pressed','true'); robotState('listening'); if(status)status.textContent='Ouvindo sua voz...';
              const clean=()=>{chatBusy=false;btn?.classList.remove('listening');btn?.setAttribute('aria-pressed','false');if(!document.querySelector('#robotAvatar.speaking,#robotAvatar.thinking'))robotState('')};
              chatRec.onresult=e=>{
                clean(); if(mySession!==session||!active('aiChatScreen'))return;
                const text=(e.results?.[0]?.[0]?.transcript||'').trim(); if(!text)return;
                const u=document.createElement('div');u.className='chat-bubble user';u.textContent=text;chat?.appendChild(u);if(chat)chat.scrollTop=chat.scrollHeight;
                robotState('thinking');if(status)status.textContent='Pensando...';
                setTimeout(()=>{
                  if(mySession!==session||!active('aiChatScreen')){robotState('');return}
                  const reply='Você disse: “'+text+'”. Continue praticando — estou ouvindo!';
                  const a=document.createElement('div');a.className='chat-bubble ai';a.textContent=reply;chat?.appendChild(a);if(chat)chat.scrollTop=chat.scrollHeight;
                  if(status)status.textContent='Toque para falar com o assistente';
                  window.speakAIWithMotion?.(reply);
                },350);
              };
              chatRec.onerror=e=>{clean();robotState('');if(status)status.textContent=statusError(e.error)};
              chatRec.onend=clean;
              try{chatRec.start()}catch(e){clean();robotState('');if(status)status.textContent='Microfone ocupado. Tente novamente.'}
            };

            window.toggleSpeechRecognition=function(){
              if(lessonBusy){stop(lessonRec);return}
              const C=SR(),btn=$('micBtn'),status=$('micStatus');
              if(!C){if(status)status.textContent='Reconhecimento de voz não disponível neste aparelho.';return}
              lessonRec=new C(); lessonRec.lang=window.currentLang||$('globalLang')?.value||'en-US'; lessonRec.interimResults=false; lessonRec.maxAlternatives=1;
              lessonBusy=true;btn?.classList.add('listening');btn?.setAttribute('aria-pressed','true');if(status)status.textContent='Ouvindo...';
              const clean=()=>{lessonBusy=false;btn?.classList.remove('listening');btn?.setAttribute('aria-pressed','false')};
              lessonRec.onresult=e=>{
                clean();
                const spoken=(e.results?.[0]?.[0]?.transcript||'').trim().toLocaleLowerCase();
                const mods=(typeof multiLangLessons!=='undefined'&&(multiLangLessons[window.currentLang]||multiLangLessons['en-US']))||[];
                const mi=Math.max(0,Math.min(Number(window.currentModuleIndex)||0,Math.max(0,mods.length-1)));const mod=mods[mi];
                const si=Math.max(0,Math.min(Number(window.currentStep)||0,Math.max(0,(mod?.lessons?.length||1)-1)));const expected=String(mod?.lessons?.[si]?.phrase||'').trim().toLocaleLowerCase();
                if(!expected){if(status)status.textContent='Frase indisponível.';return}
                const ok=spoken===expected||spoken.includes(expected)||expected.includes(spoken);
                if(ok){window.score=(Number(window.score)||0)+10;if(status){status.textContent='✅ Perfeito! +10 XP';status.style.color='var(--success-color)'}}
                else{window.lives=Math.max(0,(Number(window.lives)||3)-1);if(status){status.textContent='❌ Incorreto (-1 vida)';status.style.color='var(--error-color)'}}
                try{localStorage.setItem('falaScore',String(window.score||0))}catch(e){}
                $('scoreCount')&&( $('scoreCount').textContent=String(window.score||0) ); $('livesCount')&&( $('livesCount').textContent=String(window.lives||0) );
                try{window.updateStats?.()}catch(e){}
                if((Number(window.lives)||0)<=0)setTimeout(()=>{if(active('lessonScreen')){alert('💔 Vidas esgotadas!');window.goToHome()}},60);
              };
              lessonRec.onerror=e=>{clean();if(status)status.textContent=statusError(e.error)};
              lessonRec.onend=clean;
              try{lessonRec.start()}catch(e){clean();if(status)status.textContent='Microfone ocupado. Tente novamente.'}
            };

            window.addEventListener('error',()=>{chatBusy=false;lessonBusy=false;$('aiMicBtn')?.classList.remove('listening');$('micBtn')?.classList.remove('listening')});
            window.addEventListener('unhandledrejection',()=>{chatBusy=false;lessonBusy=false});
            document.addEventListener('visibilitychange',()=>{if(document.hidden){stop(chatRec);stop(lessonRec);chatBusy=false;lessonBusy=false;robotState('');try{speechSynthesis?.cancel()}catch(e){}}});
          })();
          </script>
          '''
          s=s.replace('</body>',v3+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate runtime and shared state
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'var currentLang=' /tmp/index.html
          grep -Fq 'falaRuntimeV3' /tmp/index.html
          grep -Fq 'statusError' /tmp/index.html
          grep -Fq 'visibilitychange' /tmp/index.html
          node - <<'NODE'
          const fs=require('fs');const s=fs.readFileSync('/tmp/index.html','utf8');
          const scripts=[...s.matchAll(/<script[^>]*>([\s\S]*?)<\/script>/gi)];
          scripts.forEach((m,i)=>{try{new Function(m[1])}catch(e){throw new Error(`Script ${i+1}: ${e.message}`)}});
          const ids=[...s.matchAll(/id="([^"]+)"/g)].map(m=>m[1]);const dup=ids.filter((x,i)=>ids.indexOf(x)!==i);if(dup.length)throw new Error('Duplicate ids: '+[...new Set(dup)].join(','));
          for(const fn of ['goToHome','startAIChat','toggleAIChatSpeech','toggleSpeechRecognition','changeLanguage'])if(!s.includes(fn))throw new Error('Missing '+fn);
          console.log('V3 runtime syntax and ids validated');
          NODE

      - name: Repack APK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/apkdir && mkdir -p /tmp/apkdir/assets
          cp /tmp/fala-base.apk /tmp/fala-v3-unsigned.apk
          cp /tmp/index.html /tmp/apkdir/assets/index.html
          cp /tmp/app_icon.webp /tmp/apkdir/assets/app_icon.webp
          cp /tmp/assistant_robot_transparent.webp /tmp/apkdir/assets/assistant_robot_transparent.webp
          cd /tmp/apkdir
          zip -q -u /tmp/fala-v3-unsigned.apk assets/index.html assets/app_icon.webp assets/assistant_robot_transparent.webp
          cd /tmp
          zip -q -d fala-v3-unsigned.apk 'META-INF/*' || true

      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: .signing/falamais.keystore
          key: fala-mais-compatible-signing-v1

      - name: Prepare signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .signing
          if [[ ! -s .signing/falamais.keystore ]]; then
            keytool -genkeypair -noprompt -keystore .signing/falamais.keystore -storepass android -alias falamais -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Fala Mais, O=Fala Mais, C=BR"
          fi

      - name: Align sign verify and inspect permissions
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          zipalign=$(find "$sdk_root/build-tools" -type f -name zipalign -print | sort -V | tail -n 1)
          apksigner=$(find "$sdk_root/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)
          "$zipalign" -f -p 4 /tmp/fala-v3-unsigned.apk /tmp/Fala-Mais-Runtime-V3-Fixed.apk
          "$apksigner" sign --ks "$GITHUB_WORKSPACE/.signing/falamais.keystore" --ks-pass pass:android --key-pass pass:android --ks-key-alias falamais /tmp/Fala-Mais-Runtime-V3-Fixed.apk
          "$apksigner" verify --verbose --print-certs /tmp/Fala-Mais-Runtime-V3-Fixed.apk
          unzip -tq /tmp/Fala-Mais-Runtime-V3-Fixed.apk >/dev/null
          unzip -p /tmp/Fala-Mais-Runtime-V3-Fixed.apk assets/index.html | grep -Fq 'falaRuntimeV3'
          for dex in classes.dex classes2.dex; do unzip -p /tmp/Fala-Mais-Runtime-V3-Fixed.apk "$dex" 2>/dev/null | strings | grep -q 'android.permission.RECORD_AUDIO' && echo 'RECORD_AUDIO permission handling present' && break || true; done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fala-mais-runtime-v3-fixed
          path: /tmp/Fala-Mais-Runtime-V3-Fixed.apk
          if-no-files-found: error
          retention-days: 14
