name: Build Fala+ Avatar Motion APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: build-fala-avatar-motion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download validated global languages APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/base
          gh run download 32876958930 -R Valdiron/App-fala-mais -n fala-mais-global-languages -D /tmp/base
          APK=$(find /tmp/base -type f -name '*.apk' -print -quit)
          test -s "$APK"
          cp "$APK" /tmp/fala-base.apk
          unzip -p /tmp/fala-base.apk assets/index.html > /tmp/index.html
          base64 --decode mobiledata/assistant_avatar_small.webp.b64 > /tmp/assistant_avatar.webp
          base64 --decode mobiledata/assistant_motion_tiny.mp4.b64 > /tmp/assistant_motion.mp4
          test -s /tmp/assistant_avatar.webp
          test -s /tmp/assistant_motion.mp4

      - name: Apply robot animation from reference video
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/index.html')
          s=p.read_text()
          s=s.replace('<img src="app_icon.webp" id="robotAvatar" class="avatar">','<video src="assistant_motion.mp4" id="robotAvatar" class="avatar assistant-motion-video" autoplay muted loop playsinline preload="auto" poster="assistant_avatar.webp" aria-label="Assistente Holográfico animado"></video>')
          s=s.replace('<div class="ico">🤖</div><h3>Assistente Holográfico</h3><p>Converse por voz e texto.</p>','<div class="ico assistant-card-avatar"><img src="assistant_avatar.webp" alt="Assistente Holográfico"></div><h3>Assistente Holográfico</h3><p>Converse por voz e texto.</p>')
          css=r'''
          /* Robot motion recreated from the user reference video */
          .assistant-card-avatar{overflow:hidden;padding:0!important;background:radial-gradient(circle,rgba(34,211,238,.18),rgba(139,92,246,.08))!important}
          .assistant-card-avatar img{width:100%;height:100%;object-fit:cover;border-radius:14px;animation:assistantCardFloat 3.2s ease-in-out infinite;filter:drop-shadow(0 0 9px rgba(139,92,246,.65))}
          .assistant-motion-video{width:210px!important;height:118px!important;max-width:72vw!important;border-radius:22px!important;object-fit:cover!important;border:2px solid rgba(96,165,250,.72)!important;background:#dfe8ef!important;box-shadow:0 0 28px rgba(59,130,246,.45),0 0 58px rgba(139,92,246,.18)!important;animation:videoStageFloat 4s ease-in-out infinite!important;will-change:transform,box-shadow,filter}
          .assistant-motion-video.listening{animation:videoListen 1s ease-in-out infinite!important;border-color:#38bdf8!important;box-shadow:0 0 34px rgba(56,189,248,.8),0 0 72px rgba(34,211,238,.24)!important}
          .assistant-motion-video.thinking{animation:videoThink 1.6s ease-in-out infinite!important;border-color:#a78bfa!important;filter:saturate(1.12) brightness(1.04)}
          .assistant-motion-video.speaking{animation:videoSpeak .58s ease-in-out infinite alternate!important;border-color:#22c55e!important;box-shadow:0 0 38px rgba(34,197,94,.9),0 0 76px rgba(34,211,238,.22)!important}
          .ai-stage{position:relative;overflow:hidden;perspective:700px}
          .ai-stage:before,.ai-stage:after{content:"";position:absolute;left:50%;transform:translateX(-50%);border-radius:50%;pointer-events:none;z-index:0}
          .ai-stage:before{width:220px;height:42px;bottom:44px;border:2px solid rgba(34,211,238,.28);box-shadow:0 0 26px rgba(59,130,246,.28);animation:holoRing 2.5s ease-in-out infinite}
          .ai-stage:after{width:158px;height:28px;bottom:51px;border:1px solid rgba(167,139,250,.35);animation:holoRing 2.5s ease-in-out .45s infinite}
          .ai-stage video{position:relative;z-index:1}
          @keyframes videoStageFloat{0%,100%{transform:translateY(0) rotate(-.5deg) scale(1)}50%{transform:translateY(-7px) rotate(.7deg) scale(1.025)}}
          @keyframes videoListen{0%,100%{transform:translateY(-3px) scale(1.02)}50%{transform:translateY(-7px) scale(1.055)}}
          @keyframes videoThink{0%,100%{transform:translateY(-4px) rotate(-1.2deg) scale(1.02)}50%{transform:translateY(-7px) rotate(1.8deg) scale(1.04)}}
          @keyframes videoSpeak{from{transform:translateY(-4px) scale(1.025)}to{transform:translateY(-8px) scale(1.06)}}
          @keyframes assistantCardFloat{0%,100%{transform:translateY(1px) rotate(-1deg) scale(1.02)}50%{transform:translateY(-4px) rotate(1deg) scale(1.08)}}
          @keyframes holoRing{0%,100%{opacity:.35;transform:translateX(-50%) scale(.82)}50%{opacity:.9;transform:translateX(-50%) scale(1.08)}}
          @media (prefers-reduced-motion:reduce){.assistant-motion-video,.assistant-card-avatar img,.ai-stage:before,.ai-stage:after{animation-duration:8s!important}}
          '''
          s=s.replace('</style>',css+'\n</style>',1)
          hook=r'''
          <script>
          (function(){
            function avatarState(state){
              var a=document.getElementById('robotAvatar'); if(!a)return;
              a.classList.remove('listening','thinking');
              if(state)a.classList.add(state);
              if(a.tagName==='VIDEO' && a.paused){a.play().catch(function(){});}
            }
            window.falaAvatarState=avatarState;
            document.addEventListener('click',function(e){
              if(e.target && (e.target.id==='aiMicBtn'||(e.target.closest&&e.target.closest('#aiMicBtn')))) avatarState('listening');
            },true);
            var obs=new MutationObserver(function(){
              var el=document.getElementById('aiMicStatus'); if(!el)return;
              var t=(el.textContent||'').toLowerCase();
              if(t.includes('ouv')||t.includes('escut')||t.includes('listening')) avatarState('listening');
              else if(t.includes('pens')||t.includes('process')||t.includes('aguarde')) avatarState('thinking');
              else if(!t.includes('falando')&&!t.includes('speaking')){var a=document.getElementById('robotAvatar');if(a)a.classList.remove('listening','thinking');}
            });
            document.addEventListener('DOMContentLoaded',function(){
              var v=document.getElementById('robotAvatar');if(v&&v.tagName==='VIDEO'){v.muted=true;v.loop=true;v.play().catch(function(){});}
              var el=document.getElementById('aiMicStatus');if(el)obs.observe(el,{childList:true,subtree:true,characterData:true});
            });
          })();
          </script>
          '''
          s=s.replace('</body>',hook+'\n</body>',1)
          s=s.replace('Pronto para conversar com você.','Olá! 👋 Estou pronto para ouvir você.')
          p.write_text(s)
          PY
          grep -Fq 'assistant-motion-video' /tmp/index.html
          grep -Fq 'assistant_motion.mp4' /tmp/index.html
          grep -Fq 'FALA_GLOBAL_LANGUAGE_COUNT' /tmp/index.html

      - name: Repack APK with animated robot assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/apkdir
          mkdir -p /tmp/apkdir/assets
          cp /tmp/fala-base.apk /tmp/fala-avatar-unsigned.apk
          cp /tmp/index.html /tmp/apkdir/assets/index.html
          cp /tmp/assistant_avatar.webp /tmp/apkdir/assets/assistant_avatar.webp
          cp /tmp/assistant_motion.mp4 /tmp/apkdir/assets/assistant_motion.mp4
          cd /tmp/apkdir
          zip -q -u /tmp/fala-avatar-unsigned.apk assets/index.html assets/assistant_avatar.webp assets/assistant_motion.mp4
          cd /tmp
          zip -q -d fala-avatar-unsigned.apk 'META-INF/*' || true

      - name: Restore stable signing key
        uses: actions/cache@v4
        with:
          path: .signing/falamais.keystore
          key: fala-mais-compatible-signing-v1

      - name: Prepare signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .signing
          if [[ ! -s .signing/falamais.keystore ]]; then
            keytool -genkeypair -noprompt -keystore .signing/falamais.keystore -storepass android -alias falamais -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Fala Mais, O=Fala Mais, C=BR"
          fi

      - name: Align sign and verify
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          zipalign=$(find "$sdk_root/build-tools" -type f -name zipalign -print | sort -V | tail -n 1)
          apksigner=$(find "$sdk_root/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)
          "$zipalign" -f -p 4 /tmp/fala-avatar-unsigned.apk /tmp/Fala-Mais-Holographic-Avatar-Motion.apk
          "$apksigner" sign --ks "$GITHUB_WORKSPACE/.signing/falamais.keystore" --ks-pass pass:android --key-pass pass:android --ks-key-alias falamais /tmp/Fala-Mais-Holographic-Avatar-Motion.apk
          "$apksigner" verify --verbose --print-certs /tmp/Fala-Mais-Holographic-Avatar-Motion.apk
          unzip -tq /tmp/Fala-Mais-Holographic-Avatar-Motion.apk >/dev/null
          unzip -p /tmp/Fala-Mais-Holographic-Avatar-Motion.apk assets/index.html | grep -Fq 'assistant-motion-video'
          unzip -p /tmp/Fala-Mais-Holographic-Avatar-Motion.apk assets/assistant_motion.mp4 >/dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fala-mais-holographic-avatar-motion
          path: /tmp/Fala-Mais-Holographic-Avatar-Motion.apk
          if-no-files-found: error
          retention-days: 14
