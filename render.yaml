services:
  - type: web
    name: fala-mais-api
    runtime: node
    plan: free
    region: virginia
    rootDir: backend
    buildCommand: npm ci --ignore-scripts --no-audit --no-fund && npm run check && npm test
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    renderSubdomainPolicy: enabled
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: OPENAI_API_KEY
        sync: false
      - key: FALA_MAIS_APP_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        value: null,https://appassets.androidplatform.net,http://localhost:4173
      - key: OPENAI_REALTIME_MODEL
        value: gpt-realtime-2.1
      - key: OPENAI_REALTIME_VOICE
        value: marin
      - key: OPENAI_TIMEOUT_MS
        value: 45000
